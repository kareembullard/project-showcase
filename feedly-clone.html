/* Base styles */
html {
  font-size: var(--font-size-base);
  font-family: var(--font-family-base);
  line-height: var(--line-height-normal);
  color: var(--color-text);
  background-color: var(--color-background);
  -webkit-font-smoothing: antialiased;
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 0;
}

*,
*::before,
*::after {
  box-sizing: inherit;
}

/* Typography */
h1,
h2,
h3,
h4,
h5,
h6 {
  margin: 0;
  font-weight: var(--font-weight-semibold);
  line-height: var(--line-height-tight);
  color: var(--color-text);
  letter-spacing: var(--letter-spacing-tight);
}

h1 {
  font-size: var(--font-size-4xl);
}
h2 {
  font-size: var(--font-size-3xl);
}
h3 {
  font-size: var(--font-size-2xl);
}
h4 {
  font-size: var(--font-size-xl);
}
h5 {
  font-size: var(--font-size-lg);
}
h6 {
  font-size: var(--font-size-md);
}

p {
  margin: 0 0 var(--space-16) 0;
}

a {
  color: var(--color-primary);
  text-decoration: none;
  transition: color var(--duration-fast) var(--ease-standard);
}

a:hover {
  color: var(--color-primary-hover);
}

code,
pre {
  font-family: var(--font-family-mono);
  font-size: calc(var(--font-size-base) * 0.95);
  background-color: var(--color-secondary);
  border-radius: var(--radius-sm);
}

code {
  padding: var(--space-1) var(--space-4);
}

pre {
  padding: var(--space-16);
  margin: var(--space-16) 0;
  overflow: auto;
  border: 1px solid var(--color-border);
}

pre code {
  background: none;
  padding: 0;
}

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-8) var(--space-16);
  border-radius: var(--radius-base);
  font-size: var(--font-size-base);
  font-weight: 500;
  line-height: 1.5;
  cursor: pointer;
  transition: all var(--duration-normal) var(--ease-standard);
  border: none;
  text-decoration: none;
  position: relative;
}

.btn:focus-visible {
  outline: none;
  box-shadow: var(--focus-ring);
}

.btn--primary {
  background: var(--color-primary);
  color: var(--color-btn-primary-text);
}

.btn--primary:hover {
  background: var(--color-primary-hover);
}

.btn--primary:active {
  background: var(--color-primary-active);
}

.btn--secondary {
  background: var(--color-secondary);
  color: var(--color-text);
}

.btn--secondary:hover {
  background: var(--color-secondary-hover);
}

.btn--secondary:active {
  background: var(--color-secondary-active);
}

.btn--outline {
  background: transparent;
  border: 1px solid var(--color-border);
  color: var(--color-text);
}

.btn--outline:hover {
  background: var(--color-secondary);
}

.btn--sm {
  padding: var(--space-4) var(--space-12);
  font-size: var(--font-size-sm);
  border-radius: var(--radius-sm);
}

.btn--lg {
  padding: var(--space-10) var(--space-20);
  font-size: var(--font-size-lg);
  border-radius: var(--radius-md);
}

.btn--full-width {
  width: 100%;
}

.btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
}

/* Form elements */
.form-control {
  display: block;
  width: 100%;
  padding: var(--space-8) var(--space-12);
  font-size: var(--font-size-md);
  line-height: 1.5;
  color: var(--color-text);
  background-color: var(--color-surface);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-base);
  transition: border-color var(--duration-fast) var(--ease-standard),
    box-shadow var(--duration-fast) var(--ease-standard);
}

textarea.form-control {
  font-family: var(--font-family-base);
  font-size: var(--font-size-base);
}

select.form-control {
  padding: var(--space-8) var(--space-12);
  -webkit-appearance: none;
  -moz-appearance: none;
  appearance: none;
  background-image: var(--select-caret-light);
  background-repeat: no-repeat;
  background-position: right var(--space-12) center;
  background-size: 16px;
  padding-right: var(--space-32);
}

/* Add a dark mode specific caret */
@media (prefers-color-scheme: dark) {
  select.form-control {
    background-image: var(--select-caret-dark);
  }
}

/* Also handle data-color-scheme */
[data-color-scheme="dark"] select.form-control {
  background-image: var(--select-caret-dark);
}

[data-color-scheme="light"] select.form-control {
  background-image: var(--select-caret-light);
}

.form-control:focus {
  border-color: var(--color-primary);
  outline: var(--focus-outline);
}

.form-label {
  display: block;
  margin-bottom: var(--space-8);
  font-weight: var(--font-weight-medium);
  font-size: var(--font-size-sm);
}

.form-group {
  margin-bottom: var(--space-16);
}

/* Card component */
.card {
  background-color: var(--color-surface);
  border-radius: var(--radius-lg);
  border: 1px solid var(--color-card-border);
  box-shadow: var(--shadow-sm);
  overflow: hidden;
  transition: box-shadow var(--duration-normal) var(--ease-standard);
}

.card:hover {
  box-shadow: var(--shadow-md);
}

.card__body {
  padding: var(--space-16);
}

.card__header,
.card__footer {
  padding: var(--space-16);
  border-bottom: 1px solid var(--color-card-border-inner);
}

/* Status indicators - simplified with CSS variables */
.status {
  display: inline-flex;
  align-items: center;
  padding: var(--space-6) var(--space-12);
  border-radius: var(--radius-full);
  font-weight: var(--font-weight-medium);
  font-size: var(--font-size-sm);
}

.status--success {
  background-color: rgba(
    var(--color-success-rgb, 33, 128, 141),
    var(--status-bg-opacity)
  );
  color: var(--color-success);
  border: 1px solid
    rgba(var(--color-success-rgb, 33, 128, 141), var(--status-border-opacity));
}

.status--error {
  background-color: rgba(
    var(--color-error-rgb, 192, 21, 47),
    var(--status-bg-opacity)
  );
  color: var(--color-error);
  border: 1px solid
    rgba(var(--color-error-rgb, 192, 21, 47), var(--status-border-opacity));
}

.status--warning {
  background-color: rgba(
    var(--color-warning-rgb, 168, 75, 47),
    var(--status-bg-opacity)
  );
  color: var(--color-warning);
  border: 1px solid
    rgba(var(--color-warning-rgb, 168, 75, 47), var(--status-border-opacity));
}

.status--info {
  background-color: rgba(
    var(--color-info-rgb, 98, 108, 113),
    var(--status-bg-opacity)
  );
  color: var(--color-info);
  border: 1px solid
    rgba(var(--color-info-rgb, 98, 108, 113), var(--status-border-opacity));
}

/* Container layout */
.section-content {
  width: 100%;
  margin-right: auto;
  margin-left: auto;
  padding-right: var(--space-16);
  padding-left: var(--space-16);
}

@media (min-width: 640px) {
  .section-content {
    max-width: var(--container-sm);
  }
}
@media (min-width: 768px) {
  .section-content {
    max-width: var(--container-md);
  }
}
@media (min-width: 1024px) {
  .section-content {
    max-width: var(--container-lg);
  }
}
@media (min-width: 1280px) {
  .section-content {
    max-width: var(--container-xl);
  }
}

/* Utility classes */
.flex {
  display: flex;
}
.flex-col {
  flex-direction: column;
}
.items-center {
  align-items: center;
}
.justify-center {
  justify-content: center;
}
.justify-between {
  justify-content: space-between;
}
.gap-4 {
  gap: var(--space-4);
}
.gap-8 {
  gap: var(--space-8);
}
.gap-16 {
  gap: var(--space-16);
}

.block {
  display: block;
}
.hidden {
  display: none;
}

/* Accessibility */
.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  margin: -1px;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border-width: 0;
}

:focus-visible {
  outline: var(--focus-outline);
  outline-offset: 2px;
}

/* Dark mode specifics */
[data-color-scheme="dark"] .btn--outline {
  border: 1px solid var(--color-border-secondary);
}

@font-face {
  font-family: 'FKGroteskNeue';
  src: url('https://r2cdn.perplexity.ai/fonts/FKGroteskNeue.woff2')
    format('woff2');
}

/* Additional styles for the RSS Reader app */

.app-container {
  display: flex;
  flex-direction: column;
  height: 100vh;
  overflow: hidden;
}

/* Header */
.header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-12) var(--space-16);
  background: var(--color-surface);
  border-bottom: 1px solid var(--color-border);
  z-index: 1000;
  position: relative;
}

.header-left {
  display: flex;
  align-items: center;
  gap: var(--space-16);
}

.sidebar-toggle {
  display: none;
  background: none;
  border: none;
  color: var(--color-text);
  font-size: var(--font-size-lg);
  cursor: pointer;
  padding: var(--space-8);
  border-radius: var(--radius-base);
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.sidebar-toggle:hover {
  background: var(--color-secondary);
}

.logo {
  display: flex;
  align-items: center;
  gap: var(--space-8);
  font-size: var(--font-size-xl);
  font-weight: var(--font-weight-bold);
  color: var(--color-primary);
}

.logo i {
  font-size: var(--font-size-2xl);
}

.header-center {
  flex: 1;
  max-width: 400px;
  margin: 0 var(--space-24);
}

.search-container {
  position: relative;
  width: 100%;
}

.search-container i {
  position: absolute;
  left: var(--space-12);
  top: 50%;
  transform: translateY(-50%);
  color: var(--color-text-secondary);
  font-size: var(--font-size-sm);
}

.search-input {
  width: 100%;
  padding: var(--space-8) var(--space-12) var(--space-8) var(--space-32);
  border: 1px solid var(--color-border);
  border-radius: var(--radius-full);

.nav-list {

}

.nav-item:hover {

}

.nav-item.active {

.nav-item i {

.category-group {

.category-header {

.category-header:hover {

.category-header i {

.category-header.collapsed i {

.feed-item:hover {

.feed-item.active {

.content-area {

  overflow: hidden;
}

.article-list {

.list-header {

  align-items: center;
  justify-content: space-between;
  padding: var(--space-16);
  border-bottom: 1px solid var(--color-border);
  background: var(--color-surface);
}

.list-title {
  font-size: var(--font-size-xl);
  font-weight: var(--font-weight-semibold);
  color: var(--color-text);
  margin: 0;
}

.list-actions {
  display: flex;
  gap: var(--space-8);
}

.articles-container {
  flex: 1;
  overflow-y: auto;
}

.article-item {
  display: flex;
  gap: var(--space-12);
  padding: var(--space-16);
  border-bottom: 1px solid var(--color-border);
  cursor: pointer;
  transition: background-color var(--duration-fast) var(--ease-standard);
}

.article-item:hover {
  background: var(--color-secondary);
}

.article-item.active {
  background: var(--color-primary);
  color: var(--color-btn-primary-text);
}

.article-item.read {

}

.article-thumbnail {
  width: 80px;
  height: 60px;
  border-radius: var(--radius-base);

}

.article-content {
  flex: 1;
  min-width: 0;
}

.article-header {
  display: flex;
  align-items: center;
  gap: var(--space-8);
  margin-bottom: var(--space-4);
}

.article-source {
  font-size: var(--font-size-xs);
  color: var(--color-text-secondary);
  font-weight: var(--font-weight-medium);
}

.article-time {
  font-size: var(--font-size-xs);
  color: var(--color-text-secondary);
}

.article-title {
  font-size: var(--font-size-sm);
  font-weight: var(--font-weight-semibold);
  color: var(--color-text);
  line-height: var(--line-height-tight);
  margin: 0 0 var(--space-4) 0;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.article-excerpt {
  font-size: var(--font-size-xs);
  color: var(--color-text-secondary);
  line-height: var(--line-height-normal);
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.article-footer {
  display: flex;
  align-items: center;
  gap: var(--space-8);
  margin-top: var(--space-8);
}

.article-actions {
  display: flex;
  gap: var(--space-4);
}

.article-action {
  background: none;
  border: none;
  color: var(--color-text-secondary);
  font-size: var(--font-size-xs);
  cursor: pointer;
  padding: var(--space-4);
  border-radius: var(--radius-sm);
  transition: color var(--duration-fast) var(--ease-standard);
}

.article-action:hover {
  color: var(--color-primary);
}

.article-action.active {
  color: var(--color-primary);
}

  margin: 0 auto;
  padding: var(--space-32);
}

  margin-bottom: var(--space-16);
  color: var(--color-primary);
}

.welcome-message h3 {
  font-size: var(--font-size-2xl);
  margin-bottom: var(--space-8);
  color: var(--color-text);
}

.article-reading-header {
  margin-bottom: var(--space-24);
}

.article-reading-title {
  font-size: var(--font-size-3xl);
  font-weight: var(--font-weight-bold);
  color: var(--color-text);
  line-height: var(--line-height-tight);
  margin-bottom: var(--space-16);
}

.article-reading-meta {
  display: flex;
  align-items: center;
  gap: var(--space-16);
  margin-bottom: var(--space-16);
  color: var(--color-text-secondary);
  font-size: var(--font-size-sm);
}

.article-reading-actions {
  display: flex;
  gap: var(--space-8);
}

.article-reading-image {
  width: 100%;
  max-width: 600px;
  border-radius: var(--radius-lg);
  margin-bottom: var(--space-24);
}

.article-reading-content {
  font-size: var(--font-size-lg);
  line-height: var(--line-height-normal);
  color: var(--color-text);
}

.article-reading-content p {
  margin-bottom: var(--space-20);
}

/* Modal */
.modal {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: rgba(0, 0, 0, 0.5);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 2000;
  opacity: 0;
  visibility: hidden;
  transition: opacity var(--duration-normal) var(--ease-standard), visibility var(--duration-normal) var(--ease-standard);
}

.modal.active {
  opacity: 1;
  visibility: visible;
}

.modal-content {
  background: var(--color-surface);
  border-radius: var(--radius-lg);
  box-shadow: var(--shadow-lg);
  width: 90%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
}

.modal-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: var(--space-20);
  border-bottom: 1px solid var(--color-border);
}

.modal-header h3 {
  font-size: var(--font-size-xl);
  font-weight: var(--font-weight-semibold);
  color: var(--color-text);
  margin: 0;
}

.modal-close {
  background: none;
  border: none;
  color: var(--color-text-secondary);
  font-size: var(--font-size-lg);
  cursor: pointer;
  padding: var(--space-4);
  border-radius: var(--radius-sm);
  transition: color var(--duration-fast) var(--ease-standard);
}

.modal-close:hover {
  color: var(--color-text);
}

.modal-body {
  padding: var(--space-20);
}

.modal-actions {
  display: flex;
  gap: var(--space-8);
  justify-content: flex-end;
  margin-top: var(--space-20);
}

/* Mobile Responsive */
@media (max-width: 768px) {
  .sidebar-toggle {
    display: block;
  }

  .side-nav {
    position: fixed;
    top: 0;
    left: 0;
    bottom: 0;
    z-index: 1500;
    transform: translateX(-100%);
    width: 280px;
  }

  .side-nav.active {
    transform: translateX(0);
  }

  .mobile-overlay {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    background: rgba(0, 0, 0, 0.5);
    z-index: 1400;
    opacity: 0;
    visibility: hidden;
    transition: opacity var(--duration-normal) var(--ease-standard), visibility var(--duration-normal) var(--ease-standard);
  }

  .mobile-overlay.active {
    opacity: 1;
    visibility: visible;
  }

  .article-list {
    width: 100%;
  }

  .reading-pane {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    bottom: 0;
    z-index: 1300;
    transform: translateX(100%);
    transition: transform var(--duration-normal) var(--ease-standard);
  }

  .reading-pane.active {
    transform: translateX(0);
  }

  .reading-pane-content {
    padding: var(--space-16);
  }

  .header-center {
    margin: 0 var(--space-8);
  }

  .add-feed-btn span {
    display: none;
  }
}

@media (max-width: 480px) {
  .article-item {
    padding: var(--space-12);
  }

  .article-thumbnail {
    width: 60px;
    height: 45px;
  }

  .list-actions {
    flex-direction: column;
    gap: var(--space-4);
  }

  .reading-pane-content {
    padding: var(--space-12);
  }

  .article-reading-title {
    font-size: var(--font-size-2xl);
  }
}

/* Dark mode specific adjustments */
@media (prefers-color-scheme: dark) {
  .article-item.active {
    background: var(--color-primary);
    color: var(--color-btn-primary-text);
  }

  .article-item.active .article-title,
  .article-item.active .article-source,
  .article-item.active .article-time,
  .article-item.active .article-excerpt {
    color: var(--color-btn-primary-text);
  }
}

[data-color-scheme="dark"] .article-item.active {
  background: var(--color-primary);
  color: var(--color-btn-primary-text);
}

[data-color-scheme="dark"] .article-item.active .article-title,
[data-color-scheme="dark"] .article-item.active .article-source,
[data-color-scheme="dark"] .article-item.active .article-time,
[data-color-scheme="dark"] .article-item.active .article-excerpt {
  color: var(--color-btn-primary-text);
}

/* Loading states */
.loading {
  display: flex;
  align-items: center;
  justify-content: center;
  padding: var(--space-32);
  color: var(--color-text-secondary);
}

.loading i {
  margin-right: var(--space-8);
  animation: spin 1s linear infinite;
}

@keyframes spin {
  from { transform: rotate(0deg); }
  to { transform: rotate(360deg); }
}

  <script>
// RSS Reader Application

  constructor() {

  async init() {

    // Add today's date to some articles for "Today" view
    const today = new Date();
    sampleArticles.forEach((article, index) => {
      if (index < 3) {
        article.publishDate = today.toISOString();
      }
    });

    // Re-stamp dates relative to now so "Today"/counts work, and add a source link
    const SOURCE_URLS = {
      "The AI Advantage": "https://www.youtube.com/@aiadvantage",
      "Fireship": "https://fireship.io/",
      "OpenAI": "https://openai.com/blog",
      "Perplexity": "https://www.perplexity.ai/",
      "The Verge": "https://www.theverge.com/",
      "TechCrunch": "https://techcrunch.com/",
      "Wired": "https://www.wired.com/",
      "GitHub": "https://github.blog/",
      "Better Than Yesterday": "https://www.youtube.com/@BetterThanYesterday",
      "Notion": "https://www.notion.so/blog",
      "Todoist": "https://www.todoist.com/inspiration",
      "BBC": "https://www.bbc.com/news",
      "Reuters": "https://www.reuters.com/",
      "Associated Press": "https://apnews.com/"
    };
    const now = Date.now(), DAY = 86400000;
    sampleArticles.forEach((a, i) => {
      const daysBack = i < 2 ? 0 : (i - 1);           // first two are "today"
      a.publishDate = new Date(now - daysBack * DAY - i * 3600000).toISOString();
      const base = SOURCE_URLS[a.source] || 'https://www.google.com/search?q=';
      a.url = a.url || (SOURCE_URLS[a.source] ? base : base + encodeURIComponent(a.title + ' ' + a.source));

  setupEventListeners() {
    // Theme toggle
    document.getElementById('themeToggle').addEventListener('click', () => {
      this.toggleTheme();
    });

    // Sidebar toggle (mobile)
    document.getElementById('sidebarToggle').addEventListener('click', () => {
      this.toggleSidebar();
    });

    // Mobile overlay
    document.getElementById('mobileOverlay').addEventListener('click', () => {
      this.closeSidebar();
    });

    // Search
    document.getElementById('searchInput').addEventListener('input', (e) => {
      this.searchQuery = e.target.value;
      this.renderArticles();
    });

    // View navigation
    document.querySelectorAll('.nav-item').forEach(item => {
      item.addEventListener('click', (e) => {
        const view = e.currentTarget.dataset.view;
        if (view) {
          this.setCurrentView(view);
        }
      });
    });

    // Mark all read
    document.getElementById('markAllReadBtn').addEventListener('click', () => {
      this.markAllRead();
    });

    // Refresh
    document.getElementById('refreshBtn').addEventListener('click', () => {
      this.refreshArticles();
    });

    // Add feed modal
    document.getElementById('addFeedBtn').addEventListener('click', () => {
      this.showAddFeedModal();
    });

    document.getElementById('modalClose').addEventListener('click', () => {
      this.hideAddFeedModal();
    });

    document.getElementById('cancelAddFeed').addEventListener('click', () => {
      this.hideAddFeedModal();
    });

    document.getElementById('addFeedForm').addEventListener('submit', (e) => {
      e.preventDefault();
      this.addFeed();
    });

    // Close modal on background click
    document.getElementById('addFeedModal').addEventListener('click', (e) => {
      if (e.target === e.currentTarget) {
        this.hideAddFeedModal();
      }
    });

    // Close reading pane on mobile
    document.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') {
        this.closeReadingPane();
      }
    });
  }

  setupTheme() {
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    this.isDarkMode = prefersDark;
    this.updateThemeIcon();
  }

  toggleTheme() {
    this.isDarkMode = !this.isDarkMode;
    document.documentElement.setAttribute('data-color-scheme', this.isDarkMode ? 'dark' : 'light');
    this.updateThemeIcon();
  }

  updateThemeIcon() {
    const icon = document.querySelector('#themeToggle i');
    icon.className = this.isDarkMode ? 'fas fa-sun' : 'fas fa-moon';
  }

  toggleSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('mobileOverlay');
    
    sidebar.classList.toggle('active');
    overlay.classList.toggle('active');
  }

  closeSidebar() {
    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('mobileOverlay');
    
    sidebar.classList.remove('active');
    overlay.classList.remove('active');
  }

  setCurrentView(view) {
    this.currentView = view;
    this.currentFeed = null;
    
    // Update active nav item
    document.querySelectorAll('.nav-item').forEach(item => {
      item.classList.remove('active');
      if (item.dataset.view === view) {
        item.classList.add('active');
      }
    });

    // Update feed items
    document.querySelectorAll('.feed-item').forEach(item => {
      item.classList.remove('active');
    });

    this.renderArticles();
    this.updateListTitle();
  }

  setCurrentFeed(category, feed) {
    this.currentView = null;
    this.currentFeed = { category, feed };
    
    // Update active states
    document.querySelectorAll('.nav-item').forEach(item => {
      item.classList.remove('active');
    });

    document.querySelectorAll('.feed-item').forEach(item => {
      item.classList.remove('active');
      if (item.dataset.feed === feed) {
        item.classList.add('active');
      }
    });

    this.renderArticles();
    this.updateListTitle();
  }

  updateListTitle() {
    const titleElement = document.getElementById('listTitle');
    if (this.currentView) {
      titleElement.textContent = this.currentView.charAt(0).toUpperCase() + this.currentView.slice(1);
    } else if (this.currentFeed) {
      titleElement.textContent = this.currentFeed.feed;
    }
  }

  renderSidebar() {
    const categoriesList = document.getElementById('categoriesList');
    categoriesList.innerHTML = '';

    Object.entries(this.feeds).forEach(([category, feeds]) => {
      const categoryGroup = document.createElement('div');
      categoryGroup.className = 'category-group';
      
      const categoryHeader = document.createElement('div');
      categoryHeader.className = 'category-header';
      categoryHeader.innerHTML = `
        <i class="fas fa-chevron-down"></i>
        <span>${category}</span>
      `;
      
      const categoryFeedsContainer = document.createElement('div');
      categoryFeedsContainer.className = 'category-feeds';
      
      feeds.forEach(feed => {
        const feedItem = document.createElement('div');
        feedItem.className = 'feed-item';
        feedItem.dataset.feed = feed;
        feedItem.innerHTML = `
          <i class="fas fa-rss"></i>
          <span>${feed}</span>
        `;
        
        feedItem.addEventListener('click', () => {
          this.setCurrentFeed(category, feed);
        });
        
        categoryFeedsContainer.appendChild(feedItem);
      });
      
      categoryHeader.addEventListener('click', () => {
        categoryHeader.classList.toggle('collapsed');
        categoryFeedsContainer.classList.toggle('collapsed');
      });
      
      categoryGroup.appendChild(categoryHeader);
      categoryGroup.appendChild(categoryFeedsContainer);
      categoriesList.appendChild(categoryGroup);
    });
  }

  getFilteredArticles() {
    let filteredArticles = [...this.articles];

    // Filter by search query
    if (this.searchQuery) {
      const query = this.searchQuery.toLowerCase();
      filteredArticles = filteredArticles.filter(article => 
        article.title.toLowerCase().includes(query) ||
        article.excerpt.toLowerCase().includes(query) ||
        article.source.toLowerCase().includes(query)
      );
    }

    // Filter by view
    if (this.currentView === 'today') {
      const today = new Date();
      const todayStr = today.toISOString().split('T')[0];
      filteredArticles = filteredArticles.filter(article => 
        article.publishDate.startsWith(todayStr)
      );
    } else if (this.currentView === 'saved') {
      filteredArticles = filteredArticles.filter(article => article.isSaved);
    } else if (this.currentFeed) {
      filteredArticles = filteredArticles.filter(article => 
        article.source === this.currentFeed.feed
      );
    }

    return filteredArticles.sort((a, b) => new Date(b.publishDate) - new Date(a.publishDate));
  }

  renderArticles() {
    const articlesContainer = document.getElementById('articlesContainer');
    const filteredArticles = this.getFilteredArticles();

    if (filteredArticles.length === 0) {
      articlesContainer.innerHTML = `
        <div class="loading">
          <i class="fas fa-inbox"></i>
          <span>No articles found</span>
        </div>
      `;
      return;
    }

    articlesContainer.innerHTML = filteredArticles.map(article => `
      <div class="article-item ${article.isRead ? 'read' : ''}" data-id="${article.id}">
        <img src="${article.thumbnail}" alt="" class="article-thumbnail">
        <div class="article-content">
          <div class="article-header">
            <span class="article-source">${article.source}</span>
            <span class="article-time">${this.formatDate(article.publishDate)}</span>
          </div>
          <h3 class="article-title">${article.title}</h3>
          <p class="article-excerpt">${article.excerpt}</p>
          <div class="article-footer">
            <span class="article-time">${article.readTime}</span>
            <div class="article-actions">
              <button class="article-action ${article.isSaved ? 'active' : ''}" data-action="save">
                <i class="fas fa-bookmark"></i>
              </button>
              <button class="article-action ${article.isRead ? 'active' : ''}" data-action="read" title="Mark read">
                <i class="fas fa-check"></i>
              </button>
              <button class="article-action" data-action="open" title="Open original article">
                <i class="fas fa-external-link-alt"></i>
              </button>
            </div>
          </div>
        </div>
      </div>
    `).join('');

    // Add event listeners to articles
    document.querySelectorAll('.article-item').forEach(item => {
      item.addEventListener('click', (e) => {
        if (!e.target.closest('.article-action')) {
          const articleId = parseInt(item.dataset.id);
          this.openArticle(articleId);
        }
      });
    });

    // Add event listeners to article actions
    document.querySelectorAll('.article-action').forEach(button => {
      button.addEventListener('click', (e) => {
        e.stopPropagation();
        const articleId = parseInt(button.closest('.article-item').dataset.id);
        const action = button.dataset.action;
        
        if (action === 'save') {
          this.toggleSaveArticle(articleId);
        } else if (action === 'read') {
          this.toggleReadArticle(articleId);
        } else if (action === 'open') {
          const art = this.articles.find(a => a.id === articleId);
          if (art && art.url) window.open(art.url, '_blank', 'noopener');
        }
      });
    });

    this.updateCounts();
  }

  openArticle(articleId) {
    const article = this.articles.find(a => a.id === articleId);
    if (!article) return;

    this.currentArticle = article;
    
    // Mark as read
    if (!article.isRead) {
      article.isRead = true;
      this.renderArticles();
    }

    // Update active article
    document.querySelectorAll('.article-item').forEach(item => {
      item.classList.remove('active');
      if (parseInt(item.dataset.id) === articleId) {
        item.classList.add('active');
      }
    });

    this.renderReadingPane();
    
    // Show reading pane on mobile
    if (window.innerWidth <= 768) {
      document.getElementById('readingPane').classList.add('active');
    }
  }

  renderReadingPane() {
    const readingPane = document.getElementById('readingPane');
    const readingContent = readingPane.querySelector('.reading-pane-content');
    
    if (!this.currentArticle) {
      readingContent.innerHTML = `
        <div class="welcome-message">
          <i class="fas fa-newspaper"></i>
          <h3>Welcome to RSS Feed Reader</h3>
          <p>Select an article to start reading, or explore your feeds in the sidebar.</p>
        </div>
      `;
      return;
    }

    const article = this.currentArticle;
    readingContent.innerHTML = `
      <div class="article-reading-header">
        <h1 class="article-reading-title">${article.title}</h1>
        <div class="article-reading-meta">
          <span>${article.source}</span>
          <span>•</span>
          <span>${this.formatDate(article.publishDate)}</span>
          <span>•</span>
          <span>${article.readTime}</span>
        </div>
        <div class="article-reading-actions">
          <a class="btn btn--primary btn--sm" href="${article.url}" target="_blank" rel="noopener noreferrer">
            <i class="fas fa-external-link-alt"></i>
            Read original
          </a>
          <button class="btn btn--outline btn--sm" onclick="rssReader.toggleSaveArticle(${article.id})">
            <i class="fas fa-bookmark"></i>
            ${article.isSaved ? 'Unsave' : 'Save'}
          </button>
          <button class="btn btn--outline btn--sm" onclick="rssReader.closeReadingPane()">
            <i class="fas fa-times"></i>
            Close
          </button>
        </div>
      </div>
      <img src="${article.thumbnail}" alt="" class="article-reading-image">
      <div class="article-reading-content">
        ${article.content}
      </div>
    `;
  }

  closeReadingPane() {
    if (window.innerWidth <= 768) {
      document.getElementById('readingPane').classList.remove('active');
    }
    
    document.querySelectorAll('.article-item').forEach(item => {
      item.classList.remove('active');
    });
  }

  toggleSaveArticle(articleId) {
    const article = this.articles.find(a => a.id === articleId);
    if (article) {
      article.isSaved = !article.isSaved;
      this.renderArticles();
      if (this.currentArticle && this.currentArticle.id === articleId) {
        this.renderReadingPane();
      }
    }
  }

  toggleReadArticle(articleId) {
    const article = this.articles.find(a => a.id === articleId);
    if (article) {
      article.isRead = !article.isRead;
      this.renderArticles();
    }
  }

  markAllRead() {
    const filteredArticles = this.getFilteredArticles();
    filteredArticles.forEach(article => {
      article.isRead = true;
    });
    this.renderArticles();
  }

  refreshArticles() {
    const refreshBtn = document.getElementById('refreshBtn');
    const icon = refreshBtn.querySelector('i');
    
    icon.style.animation = 'spin 1s linear infinite';
    
    setTimeout(() => {
      icon.style.animation = '';
      this.renderArticles();
    }, 1000);
  }

  updateCounts() {
    const todayArticles = this.articles.filter(article => {
      const today = new Date().toISOString().split('T')[0];
      return article.publishDate.startsWith(today) && !article.isRead;
    });
    
    const allUnread = this.articles.filter(article => !article.isRead);
    const savedArticles = this.articles.filter(article => article.isSaved);

    document.getElementById('todayCount').textContent = todayArticles.length;
    document.getElementById('allCount').textContent = allUnread.length;
    document.getElementById('savedCount').textContent = savedArticles.length;
  }

  showAddFeedModal() {
    const modal = document.getElementById('addFeedModal');
    const categorySelect = document.getElementById('feedCategory');
    
    // Populate category options
    categorySelect.innerHTML = '<option value="">Select a category</option>';
    Object.keys(this.feeds).forEach(category => {
      const option = document.createElement('option');
      option.value = category;
      option.textContent = category;
      categorySelect.appendChild(option);
    });
    
    modal.classList.add('active');
  }

  hideAddFeedModal() {
    const modal = document.getElementById('addFeedModal');
    modal.classList.remove('active');
    document.getElementById('addFeedForm').reset();
  }

  addFeed() {
    const feedUrl = document.getElementById('feedUrl').value;
    const feedCategory = document.getElementById('feedCategory').value;
    const feedName = document.getElementById('feedName').value;
    
    if (!feedUrl || !feedCategory) {
      alert('Please fill in all required fields');
      return;
    }
    
    const feedDisplayName = feedName || this.extractFeedName(feedUrl);
    
    // Add to feeds data
    if (!this.feeds[feedCategory]) {
      this.feeds[feedCategory] = [];
    }
    
    if (!this.feeds[feedCategory].includes(feedDisplayName)) {
      this.feeds[feedCategory].push(feedDisplayName);
      this.renderSidebar();
      this.hideAddFeedModal();
      
      // Show success message
      this.showNotification('Feed added successfully!', 'success');
    } else {
      this.showNotification('Feed already exists!', 'warning');
    }
  }

  extractFeedName(url) {
    try {
      const domain = new URL(url).hostname;
      return domain.replace('www.', '').split('.')[0];
    } catch {
      return 'New Feed';
    }
  }

  showNotification(message, type = 'info') {
    // Simple notification system
    const notification = document.createElement('div');
    notification.className = `notification notification--${type}`;
    notification.textContent = message;
    notification.style.cssText = `
      position: fixed;
      top: 20px;
      right: 20px;
      padding: 12px 16px;
      border-radius: 6px;
      color: white;
      font-weight: 500;
      z-index: 3000;
      animation: slideIn 0.3s ease-out;
    `;
    
    const colors = {
      success: '#22c55e',
      warning: '#f59e0b',
      error: '#ef4444',
      info: '#3b82f6'
    };
    
    notification.style.backgroundColor = colors[type] || colors.info;
    
    document.body.appendChild(notification);
    
    setTimeout(() => {
      notification.remove();
    }, 3000);
  }

  formatDate(dateString) {
    const date = new Date(dateString);
    const now = new Date();
    const diffTime = Math.abs(now - date);
    const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
    
    if (diffDays === 1) {
      return 'Today';
    } else if (diffDays === 2) {
      return 'Yesterday';
    } else if (diffDays <= 7) {
      return `${diffDays - 1} days ago`;
    } else {
      return date.toLocaleDateString();
    }
  }
}

         var s = document.createElement('span');
         s.className = 'ph-ripple';
         var size = Math.max(r.width, r.height);
         s.style.width = s.style.height = size + 'px';
         s.style.left = (e.clientX - r.left) + 'px';
         s.style.top = (e.clientY - r.top) + 'px';
         btn.appendChild(s);
         setTimeout(function () { s.remove(); }, 640);
       });

       if (!reduce && window.matchMedia('(pointer:fine)').matches && window.innerWidth > 900) {
         var ring = document.createElement('div');
         ring.className = 'ph-cursor';
         document.body.appendChild(ring);
         var x = innerWidth / 2, y = innerHeight / 2, rx = x, ry = y;
         document.addEventListener('mousemove', function (e) { x = e.clientX; y = e.clientY; });
         (function loop() { rx += (x - rx) * .18; ry += (y - ry) * .18; ring.style.transform = 'translate(' + rx + 'px,' + ry + 'px) translate(-50%,-50%)'; requestAnimationFrame(loop); })();
         var hoverSel = 'a,button,.btn,.nav-tab,.tab-btn,.tab-item,.menu-item,.card,[role="button"],input,select,textarea,[data-theme-toggle]';
         document.addEventListener('mouseover', function (e) { if (e.target.closest(hoverSel)) ring.classList.add('hover'); });
         document.addEventListener('mouseout', function (e) { if (e.target.closest(hoverSel)) ring.classList.remove('hover'); });
       }
     }

     if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', start);
     else start();
   })();
  </script>
 </body>
</html>
